# dev/staging 전용 추가 서비스 / extra shared deps. `docker compose up` 시 base 와 자동 병합.
# base = postgres(pgvector) + redis (always). 여기서 객체저장/벡터분리/관측을 보강.
# prod 는 compose=false (K8s+Helm) → 이 파일 미사용.
services:
  # 원문/파생/스냅샷 객체 저장 (민감 원문 ↔ 검색용 분리, PRD §7)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-redactflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devpass}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 벡터 분리 백엔드 (VECTOR_BACKEND=qdrant 시). `--profile vector` 로 opt-in.
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    profiles: ["vector"]

  # 범용 문서 파서 (TIKA_URL). `--profile parse`. PDF/DOCX/PPTX → 텍스트.
  tika:
    image: apache/tika:latest
    ports: ["9998:9998"]
    profiles: ["parse"]

  # 과학문서 PDF 파서 (GROBID_URL → TEI). `--profile parse`.
  grobid:
    image: lfoppiano/grobid:0.8.1
    ports: ["8070:8070"]
    profiles: ["parse"]

  # 관측/평가 (Langfuse v2). 기존 postgres 에 별도 DB 사용. `--profile obs`.
  # 실제 self-host 는 clickhouse 등 추가 필요 — dev 단순화: SDK 호환 엔드포인트만.
  langfuse:
    image: langfuse/langfuse:2
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://redactflow:${POSTGRES_PASSWORD:-devpass}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-secret}
      SALT: ${LANGFUSE_SALT:-dev-salt}
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["obs"]

volumes:
  miniodata:
  qdrantdata:
