# DaD DeID Pipeline — bio-rag-research (multi-service). `make up`=infra only, `make dev`=+app profile.
services:
  # ---------- 인프라 / datastore (always on `make up`) ----------
  postgres:
    image: pgvector/pgvector:pg16          # postgres + pgvector
    environment:
      POSTGRES_USER: redactflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: redactflow
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redactflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- 선택 인프라 스텁 (도메인 stack_overrides) / optional, opt-in ----------
  # 벡터 분리 백엔드 (dev/staging/prod 에서 pgvector ↔ Qdrant 전환):
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports: ["6333:6333"]
  #   profiles: ["vector"]
  # weaviate:
  #   image: cr.weaviate.io/semitechnologies/weaviate:latest
  #   ports: ["8080:8080"]
  #   profiles: ["vector"]
  # 원문/파생/스냅샷 객체 저장 (민감 원문 ↔ 검색용 분리):
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   ports: ["9000:9000", "9001:9001"]
  #   profiles: ["object"]
  # GraphRAG (후속):
  # neo4j:
  #   image: neo4j:5
  #   ports: ["7474:7474", "7687:7687"]
  #   profiles: ["graph"]

  # ---------- app 서비스 (profiles:[app] → `make up` 제외) ----------
  deid:                                    # 검출 + 정책엔진 + 변환 (FastAPI) ← PRD 핵심
    build: ./services/deid
    env_file: [".env.${ENV:-dev}"]
    ports: ["8001:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["app"]

  rag:                                     # 분리 인덱싱 + 검색 (FastAPI + LangChain/LlamaIndex)
    build: ./services/rag
    env_file: [".env.${ENV:-dev}"]
    ports: ["8002:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["app"]

  worker:                                  # OCR / 대량 재색인 워커 (Go, 선택)
    build: ./services/worker
    env_file: [".env.${ENV:-dev}"]
    depends_on:
      redis: { condition: service_healthy }
    profiles: ["app"]

  # ---------- pnpm 워크스페이스 앱 (호스트 dev 권장: pnpm --filter <app> dev) ----------
  # portal/bff 는 루트 lockfile/workspace 컨텍스트 필요 → compose 빌드 대신 host 실행.
  # prod 이미지는 루트 컨텍스트 멀티스테이지(`pnpm --filter ... deploy`)로 별도 작성.

volumes:
  pgdata:
