<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>deid-simulator-extended</title><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet"><style>:root,[data-theme=light]{--bg:#f7f6f2;--surface:#fbfbf8;--surface2:#f0ede8;--text:#23211c;--muted:#6f6d67;--primary:#01696f;--error:#a12c7b;--warn:#9a4d17;--success:#437a22;--border:#d7d2ca;--r:18px;--shadow:0 10px 30px rgba(0,0,0,.08)}[data-theme=dark]{--bg:#161513;--surface:#1d1b18;--surface2:#26231f;--text:#ece8e1;--muted:#aaa59d;--primary:#4f98a3;--error:#d574b5;--warn:#d48a57;--success:#82ba5d;--border:#3b3833;--shadow:0 10px 30px rgba(0,0,0,.35)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Satoshi',sans-serif;background:var(--bg);color:var(--text);line-height:1.5} .wrap{max-width:1460px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.top h1{font-size:clamp(1.6rem,1rem + 2vw,3rem);line-height:1.05}.top p{color:var(--muted);margin-top:8px;max-width:72ch}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:12px 16px;border-radius:999px;cursor:pointer}.layout{display:grid;grid-template-columns:330px 1fr;gap:20px}.panel,.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}.panel{padding:20px;position:sticky;top:20px;height:fit-content}.card{padding:20px}.panel h2,.card h2{font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}label{display:block;font-size:.92rem;font-weight:700;margin-bottom:8px}select,textarea{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:12px;border-radius:12px;font:inherit}textarea{min-height:180px;resize:vertical}.field{margin-bottom:16px}.action-row{display:flex;gap:10px;flex-wrap:wrap}.primary{background:var(--primary);color:#fff;border-color:transparent}.grid{display:grid;gap:20px}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.stat .k{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}.stat .v{font-size:2rem;font-weight:700}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}ul{padding-left:18px}li{margin-bottom:8px}.result{white-space:pre-wrap;background:var(--surface2);padding:16px;border:1px solid var(--border);border-radius:14px;min-height:220px}.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700}.high{background:rgba(161,44,123,.12);color:var(--error)}.mid{background:rgba(154,77,23,.12);color:var(--warn)}.low{background:rgba(67,122,34,.12);color:var(--success)}table{width:100%;border-collapse:collapse;font-size:.94rem}th,td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}code{background:var(--surface2);padding:2px 6px;border-radius:8px}pre{white-space:pre-wrap;background:var(--surface2);padding:14px;border-radius:14px;border:1px solid var(--border);overflow:auto}@media (max-width:1100px){.layout,.stats,.two{grid-template-columns:1fr}.panel{position:static}}</style></head><body><div class="wrap"><div class="top"><div><h1>업종별 데이터 비식별 시뮬레이터 확장판</h1><p>금융/의료/제조 가이드라인에 따라 최적 비식별 기술, 규제 위험도, 재식별 모니터링 로드맵, JSON 정책 스키마, Langfuse 감사 로그 예시를 함께 보여줍니다.</p></div><button class="btn" id="theme">테마 전환</button></div><div class="layout"><aside class="panel"><h2>입력</h2><div class="field"><label>업종</label><select id="industry"><option value="finance">금융</option><option value="healthcare">의료</option><option value="manufacturing">제조</option></select></div><div class="field"><label>샘플 텍스트</label><textarea id="sample"></textarea></div><div class="action-row"><button class="btn primary" id="run">실행</button><button class="btn" id="load">예시 로드</button></div></aside><main class="grid"><section class="grid stats"><div class="card stat"><div class="k">검출 수</div><div class="v" id="detected">0</div></div><div class="card stat"><div class="k">변환 수</div><div class="v" id="transformed">0</div></div><div class="card stat"><div class="k">변환율</div><div class="v" id="rate">0%</div></div><div class="card stat"><div class="k">위험도</div><div class="v" id="risk">-</div></div><div class="card stat"><div class="k">권장 전략</div><div class="v" id="strategy" style="font-size:1rem">-</div></div></section><section class="two"><div class="card"><h2>법적 의무 체크리스트</h2><ul id="legal"></ul></div><div class="card"><h2>재식별 모니터링 자동화 로드맵</h2><ul id="roadmap"></ul></div></section><section class="two"><div class="card"><h2>원문</h2><div class="result" id="orig"></div></div><div class="card"><h2>비식별 결과</h2><div class="result" id="masked"></div></div></section><section class="card"><h2>비식별 처리 정책 JSON 예시</h2><pre id="policy"></pre></section><section class="card"><h2>Langfuse 감사 이벤트 예시</h2><pre id="langfuse"></pre></section></main></div></div><script>const cfg={finance:{risk:'HIGH',strategy:'토큰화 + 부분 마스킹',sample:'고객 홍길동의 계좌번호는 123-45-678901이며 카드번호는 5123-4567-8910-1112입니다. 2026년 5월 거래금액은 12,450,000원입니다.',legal:['가명정보 처리 목적과 범위를 문서화한다.','재식별 금지와 위반 보고 절차를 수립한다.','외부 모델/API 전송 시 승인 절차를 강제한다.','고객 식별정보와 거래정보 결합 위험을 평가한다.'],roadmap:['ingestion 시 금융문서 태깅과 고객식별 필드 자동 검출','token vault 기반 계좌/카드 치환','RAG 적재 전 외부반출 플래그 점검','재식별 시도 탐지 및 예외승인 로그 월간 점검']},healthcare:{risk:'HIGH',strategy:'가명처리 + 일반화',sample:'홍길동 환자의 주민등록번호는 900101-1234567이며 차트번호는 PT-9912입니다. 2026-05-20 검사 결과 HbA1c는 8.1%입니다.',legal:['활용 목적과 법적 근거를 명확히 기록한다.','직접식별자 제거 후 적정성 평가를 수행한다.','재식별 키를 분리 저장한다.','의료와 비의료 데이터 결합 시 별도 심사를 거친다.'],roadmap:['PHI 룰셋 + NER 병행 검출','검사일·검사값 일반화 및 범주화','de-id 데이터셋만 임베딩/학습 허용','재식별 위험 점수 기준 월간 샘플링 감사']},manufacturing:{risk:'MEDIUM_HIGH',strategy:'범위화 + recipe token',sample:'스프 A의 배합비율은 정제수 62.5%, 향신료 17.3%, 첨가제 4.8%입니다. 반응기 온도는 182.4도, 압력은 6.7bar입니다.',legal:['개인정보와 영업비밀을 분리 분류한다.','대외 반출 범위와 NDA 준수 상태를 확인한다.','산업기술/영업비밀 승인 절차를 운영한다.','설비·배합·도면 데이터는 최소권한 열람을 적용한다.'],roadmap:['recipe/설비 파라미터 엔티티 자동 검출','절대값을 bucket 또는 token으로 치환','trade_secret 플래그 문서는 export 금지','반출/열람 로그에 대한 주간 이상 탐지']}};function run(){const industry=document.getElementById('industry').value;const c=cfg[industry];let t=document.getElementById('sample').value;let d=0,m=0;const rep=(re,val)=>{t=t.replace(re,()=>{d++;m++;return val;});};rep(/홍길동/g,'[이름_가명처리]');rep(/\b\d{6}-\d{7}\b/g,'[주민번호_가명처리]');rep(/\bPT-\d+\b/g,'[차트번호_가명처리]');rep(/\b\d{3}-\d{2}-\d{6}\b/g,'[계좌번호_마스킹]');rep(/\b\d{4}-\d{4}-\d{4}-\d{4}\b/g,'[카드번호_마스킹]');if(industry==='finance'){rep(/\b[\d,]+원\b/g,'[거래금액_범주화]');} if(industry==='healthcare'){rep(/\b\d{4}-\d{2}-\d{2}\b/g,'[검사일_일반화]');rep(/\bHbA1c는\s*[\d.]+%/g,'HbA1c는 [검사값_범주화]');} if(industry==='manufacturing'){rep(/\b\d+(?:\.\d+)?%\b/g,'[배합비율_RANGE]');rep(/\b\d+(?:\.\d+)?도\b/g,'[온도_RANGE]');rep(/\b\d+(?:\.\d+)?bar\b/g,'[압력_RANGE]');}document.getElementById('orig').textContent=document.getElementById('sample').value;document.getElementById('masked').textContent=t;document.getElementById('detected').textContent=d;document.getElementById('transformed').textContent=m;document.getElementById('rate').textContent=(d?Math.round(m/d*100):0)+'%';document.getElementById('risk').textContent=c.risk;document.getElementById('strategy').textContent=c.strategy;document.getElementById('legal').innerHTML=c.legal.map(v=>`<li>${v}</li>`).join('');document.getElementById('roadmap').innerHTML=c.roadmap.map(v=>`<li>${v}</li>`).join('');document.getElementById('policy').textContent=JSON.stringify({policy_id:`deid-${industry}-v1`,version:'1.0.0',industry:{domain:industry,ksic_section:industry==='finance'?'K':industry==='healthcare'?'Q':'C'},classification:{default_level:industry==='manufacturing'?'CONFIDENTIAL':'RESTRICTED',trade_secret_enabled:industry==='manufacturing',allowed_use:['SEARCH','RAG']},rules:[{field_type:industry==='finance'?'account_number':industry==='healthcare'?'patient_identifier':'recipe_ratio',detection:{regex:'sample-regex'},action:industry==='manufacturing'?'RANGE_BUCKET':'TOKENIZE',replacement:industry==='manufacturing'?'[RANGE]':'[TOKEN]',applies_to:['TEXT','OCR'],fine_tuning_allowed:false}],risk_model:{base_risk:c.risk,reidentification_review:{required:true,frequency:'MONTHLY',threshold_score:0.7}},audit:{log_input_hash:true,store_transform_map:true,approval_required_for_export:true,langfuse_trace_tags:['deid',industry]}},null,2);document.getElementById('langfuse').textContent=JSON.stringify({trace_id:'trc_demo_001',pipeline:'document-rag',industry:industry,policy_id:`deid-${industry}-v1`,sensitivity_level:industry==='manufacturing'?'CONFIDENTIAL':'RESTRICTED',events:[{name:'deid.detect',metadata:{entities_detected:d,risk_score:industry==='finance'?0.79:industry==='healthcare'?0.86:0.68}},{name:'deid.transform',metadata:{transformed:m,transform_rate:d?Number((m/d).toFixed(2)):0}},{name:'authz.openfga.check',metadata:{allowed:true,relation:'can_query'}},{name:'rag.answer',metadata:{blocked_sensitive_fields:industry==='manufacturing'?3:2,tokens_in:1200,tokens_out:240}}]},null,2);}document.getElementById('load').addEventListener('click',()=>{document.getElementById('sample').value=cfg[document.getElementById('industry').value].sample;run();});document.getElementById('run').addEventListener('click',run);document.getElementById('industry').addEventListener('change',()=>{document.getElementById('sample').value=cfg[document.getElementById('industry').value].sample;run();});let theme=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',theme);document.getElementById('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',theme);});document.getElementById('sample').value=cfg.finance.sample;run();</script></body></html>
