[project]
name = "redactflow-deid"
version = "0.1.0"
description = "DaD DeID Pipeline 검출+정책엔진+변환 서비스 / detection + policy + transform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # 검출 / detection (PRD §3 ⓑ)
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    # spaCy NER 모델 (KR/EN) — 고정 핀
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "ko-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ko_core_news_sm-3.8.0/ko_core_news_sm-3.8.0-py3-none-any.whl",
    # OCR/파싱 어댑터는 worker 또는 별도 의존(Tika/Unstructured/Tesseract/OCRmyPDF/GROBID)
    "pytesseract>=0.3.13",
    "pillow>=12.2.0",
    "pypdf>=6.13.1",
    "python-docx>=1.2.0",
    "sentence-transformers>=5.5.1",
    "anthropic>=0.109.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7", "honcho>=1.1"]

[tool.hatch.metadata]
allow-direct-references = true              # spaCy 모델 URL 직접참조 허용

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
